<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Events | RestrictedRP</title><link rel="stylesheet" href="/style.css"><style>
.staff-page{max-width:1050px;margin:auto;padding:140px 24px 90px}.form-wrap{margin-top:45px;border:1px solid var(--line);background:#0c0c0d;padding:30px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:8px}.field.full{grid-column:1/-1}.field label{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:#777}.field input,.field textarea,.field select{font:inherit;background:#111112;border:1px solid var(--line);color:#eee;padding:13px;outline:none}.field textarea{min-height:130px;resize:vertical}.check{display:flex;align-items:center;gap:8px;color:#aaa;font-size:12px}.existing{margin-top:40px}.existing h2{font:700 28px "Space Grotesk"}.manage-list{display:grid;gap:10px;margin-top:20px}.manage-item{display:flex;justify-content:space-between;gap:15px;align-items:center;border:1px solid var(--line);padding:16px;background:#0c0c0d}.manage-item strong{font-family:"Space Grotesk"}.manage-item small{display:block;color:#666;margin-top:4px}.danger{border-color:rgba(239,27,37,.4)!important;color:#ff858a!important}@media(max-width:700px){.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.manage-item{align-items:flex-start;flex-direction:column}}
</style></head><body><header class="site-header"><a class="brand" href="/"><img src="/assets/restrictedrp-logo.png"><span>Restricted<span>RP</span></span></a><nav class="nav open" style="position:static;display:flex"><a href="/">Home</a><a href="/events">Events</a><a href="/auth/logout">Logout</a></nav></header><main class="staff-page"><span class="section-number">EVENT MANAGEMENT</span><h1 style="font:900 clamp(3rem,7vw,6rem)/.9 'Space Grotesk';letter-spacing:-4px;margin:18px 0">CREATE<br><em>EVENT.</em></h1><p style="color:#777;max-width:650px">Only members with one of the configured Discord event-manager roles can use this page.</p><form id="form" class="form-wrap"><div class="form-grid"><div class="field"><label>Event title</label><input name="title" required placeholder="RestrictedRP Community Night"></div><div class="field"><label>Category</label><select name="category"><option>Community</option><option>Police</option><option>EMS</option><option>Criminal</option><option>Business</option><option>Competition</option></select></div><div class="field"><label>Department</label><input name="department" placeholder="General"></div><div class="field"><label>Host</label><input name="host" placeholder="RestrictedRP Staff"></div><div class="field"><label>Date</label><input type="date" name="date" required></div><div class="field"><label>Start time</label><input type="time" name="start_time" required></div><div class="field"><label>End time</label><input type="time" name="end_time"></div><div class="field"><label>Capacity (0 = unlimited)</label><input type="number" min="0" name="capacity" value="0"></div><div class="field"><label>Location</label><input name="location" placeholder="Los Santos / Sandy Shores"></div><div class="field"><label>Postal</label><input name="postal" placeholder="1234"></div><div class="field full"><label>Description</label><textarea name="description" placeholder="Tell players what this event is about..."></textarea></div><label class="check"><input type="checkbox" name="featured"> Featured event</label><div class="field full"><button class="button primary" type="submit">Publish Event <span>→</span></button></div></div></form><section class="existing"><h2>Published Events</h2><div id="list" class="manage-list">Loading...</div></section></main><script>
async function api(u,o){const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
async function load(){const m=await api('/api/me');if(!m.event_manager){location='/events';return}const l=await api('/api/events');list.innerHTML=l.length?l.map(e=>`<div class="manage-item"><div><strong>${esc(e.title)}</strong><small>${esc(e.date)} • ${esc(e.start_time)} • ${e.rsvp_count} RSVP</small></div><button class="button ghost danger" onclick="del(${e.id})">Delete</button></div>`).join(''):'<span style="color:#666">No events published.</span>'}
form.addEventListener('submit',async ev=>{ev.preventDefault();const d=Object.fromEntries(new FormData(form));d.featured=!!d.featured;try{await api('/api/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});form.reset();alert('Event published.');load()}catch(e){alert(e.message)}});async function del(id){if(!confirm('Delete this event?'))return;try{await api('/api/events/'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}load();
</script></body></html>
